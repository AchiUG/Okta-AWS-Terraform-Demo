name: CD

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      OKTA_ORG_NAME: ${{ secrets.OKTA_ORG_NAME }}
      OKTA_API_TOKEN: ${{ secrets.OKTA_API_TOKEN }}
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Apply Okta config
        working-directory: ./okta
        run: |
          terraform init -input=false
          terraform apply -input=false -auto-approve \
            -var "okta_org_name=$OKTA_ORG_NAME" \
            -var "okta_api_token=$OKTA_API_TOKEN"

      - name: Apply AWS infra
        working-directory: ./aws
        run: |
          terraform init -input=false
          terraform apply -input=false -auto-approve \
            -var "aws_region=$AWS_REGION"

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig --name cicd-eks --region $AWS_REGION

      - name: Deploy to EKS
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml
