name: CD

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      OKTA_ORG_NAME: ${{ secrets.OKTA_ORG_NAME }}
      OKTA_API_TOKEN: ${{ secrets.OKTA_API_TOKEN }}
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8

      - name: Apply Okta config
        working-directory: ./okta
        run: |
          terraform init -input=false -backend-config=backend-prod.conf -backend-config="region=us-east-1"
          terraform apply -input=false -auto-approve \
            -var "okta_org_name=$OKTA_ORG_NAME" \
            -var "okta_api_token=$OKTA_API_TOKEN"

      - name: Apply AWS infra
        working-directory: ./aws
        run: |
          terraform init -input=false -backend-config=backend-prod.conf -backend-config="region=us-east-1"
          terraform apply -input=false -auto-approve \
            -var "aws_region=$AWS_REGION"

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig --name cicd-eks --region $AWS_REGION

      - name: Preflight cluster diagnostics
        run: |
          kubectl version
          kubectl get nodes -o wide || true
          kubectl get ns
          kubectl get events -A --sort-by='.lastTimestamp' || true

      - name: Wait for ready worker nodes
        run: |
          NODE_COUNT=$(kubectl get nodes --no-headers 2>/dev/null | wc -l | tr -d ' ')
          if [ "$NODE_COUNT" = "0" ]; then
            echo "No worker nodes found in cluster. Kubernetes workloads cannot be scheduled."
            kubectl get events -A --sort-by='.lastTimestamp' || true
            exit 1
          fi
          kubectl wait --for=condition=Ready nodes --all --timeout=10m
          kubectl get nodes -o wide

      - name: Deploy to EKS
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml

      - name: Restart deployment (force fresh rollout)
        run: kubectl rollout restart deployment/demo-app -n demo

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/demo-app -n demo --timeout=8m

      - name: Show pod status (on rollout failure)
        if: failure()
        run: |
          kubectl get deployment demo-app -n demo -o wide || true
          kubectl get rs -n demo -o wide || true
          kubectl get pods -n demo -o wide
          kubectl describe deployment demo-app -n demo
          kubectl describe pods -n demo
          kubectl get events -n demo --sort-by='.lastTimestamp'
