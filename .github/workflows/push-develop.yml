name: Dev Build
on:
  push:
    branches: [ develop ]
jobs:
  dev_build:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      TF_LOG: INFO
      TF_INPUT: false
    defaults:
      run:
        shell: bash
    steps:
    # Checkout the GitHub Actions runner
    - name: Checkout
      uses: actions/checkout@v4
   # Get AWS Credentials via OIDC
    - name: Configure aws credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1
  # Install Terraform CLI
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.8
 # Run Terraform commands
    - name: Terraform Init
      id: init
      env:
        TF_VAR_AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      run: terraform -chdir="terraform" init -backend-config=backend-dev.conf
    - name: Terraform Plan
      id: plan
      run: terraform -chdir="terraform" plan -var-file=vars-dev.tfvars
    - name: Terraform Apply
      id: apply
      run: terraform -chdir="terraform" apply -auto-approve -var-file=vars-dev.tfvars